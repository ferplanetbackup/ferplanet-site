backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pagine"
    label: "Contenuti del Sito"
    files:
      - file: "index.html"
        label: "Pagina Principale"
        name: "home"
        fields:
          - { label: "Titolo Principale (Hero)", name: "title", widget: "string" }
          - { label: "Sottotitolo", name: "subtitle", widget: "string" }
          - { label: "Testo Chi Siamo", name: "body", widget: "markdown" }
          - { label: "URL o Embed PDF Sfogliabile", name: "pdf_embed", widget: "string", required: false }
