backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pagine"
    label: "Contenuti del Sito"
    files:
      - file: "index.html"
        label: "Pagina Principale"
        name: "home"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Testo Principale", name: "body", widget: "markdown" }
